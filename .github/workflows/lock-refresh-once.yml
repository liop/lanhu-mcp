name: Refresh dependency lock (one time)
on:
  push:
    paths:
      - '.github/workflows/lock-refresh-once.yml'
permissions:
  contents: write
jobs:
  update:
    if: github.ref == 'refs/heads/security/loopback-cws-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts && npm audit fix --package-lock-only --ignore-scripts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock patched dependency versions"
            git push
          fi
